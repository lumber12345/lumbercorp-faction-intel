services:
  - type: web
    name: lumbercorp-faction-intel
    runtime: static
    buildCommand: mkdir -p public && cp index.html public/index.html
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: no-cache
